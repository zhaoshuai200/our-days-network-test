<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>手机上传连接检查</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3ed;color:#304b62;font:15px/1.8 system-ui}main{width:min(520px,calc(100% - 40px));margin:10vh auto}h1{font:28px/1.5 Georgia,"Songti SC",serif}button{padding:12px 20px;border:1px solid #a5bacb;border-radius:24px;color:#304b62;background:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.5}textarea{width:100%;height:180px;padding:12px;margin-top:16px;font:13px/1.8 system-ui;border:1px solid #bacbd6;border-radius:10px}.note{font-size:12px;color:#667b8b}a{color:#365e80}</style></head><body><main><h1>检查手机上传连接</h1><p>这一步只检测手机能否连接更新相册所需的 GitHub 接口，不上传照片，也不需要密钥或账号密码。</p><button id="start">开始检查</button><p id="status" role="status"></p><textarea id="report" aria-label="检查结果" readonly hidden></textarea><button id="copy" hidden>复制结果</button><p class="note">基础连接通过后，还需要接入管理授权和上传页面；目前尚不能上传照片。</p><a href="./">返回相册</a></main><script>
const start=document.querySelector('#start'),status=document.querySelector('#status'),report=document.querySelector('#report'),copy=document.querySelector('#copy');
start.onclick=async()=>{start.disabled=true;status.textContent='正在连接…';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000),begin=performance.now();let result;
try{const response=await fetch('https://api.github.com/rate_limit',{signal:controller.signal,credentials:'omit',cache:'no-store'});result=response.ok?'基础连接正常':`已连接到接口，HTTP ${response.status}；仍需检查额度或权限限制`;}
catch(e){result=e.name==='AbortError'?'15 秒内未完成连接':'连接未完成，可能受网络或浏览器限制';}finally{clearTimeout(timer);start.disabled=false;}
status.textContent=result;report.value=['手机上传连接检查',new Date().toLocaleString(),result,`耗时：${((performance.now()-begin)/1000).toFixed(1)} 秒`,'手机型号 / 浏览器：请补充','流量或 Wi-Fi / 是否关闭代理：请补充'].join('\n');report.hidden=false;copy.hidden=false;};
copy.onclick=async()=>{try{await navigator.clipboard.writeText(report.value);status.textContent='结果已复制，可以发给我。';}catch{report.focus();report.select();status.textContent='请长按结果文字复制。';}};
</script></body></html>
