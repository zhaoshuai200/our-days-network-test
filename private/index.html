*{box-sizing:border-box}body{margin:0;color:#304b62;background:radial-gradient(ellipse at top right,#dce8f1,transparent 70%),#f5f3ec;font:15px/1.8 system-ui}main{width:min(440px,calc(100% - 40px));margin:12dvh auto}h1{font:34px/1.5 Georgia,"Songti SC",serif;font-weight:400}p{color:#607588}input{display:block;width:100%;padding:15px;border:1px solid #b6c9d8;border-radius:10px;font:16px monospace;background:#fffdf8}button{cursor:pointer;border:1px solid #9fb7ca;border-radius:24px;padding:12px 20px;color:#304b62;background:#fffdf8;font:inherit}form button{width:100%;margin-top:20px;background:#385a76;color:white}button:disabled{opacity:.6;cursor:wait}.note{font-size:12px}#status{min-height:30px}#viewer{width:100%;height:calc(100dvh - 48px);border:0;display:block}#viewer[hidden],#session[hidden],main[hidden]{display:none}#session{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#f5f3ec;font-size:12px}#lock{padding:5px 13px;font-size:12px}progress{width:100%;accent-color:#385a76}[hidden]{display:none!important}</style></head><body>
<main id="entry"><p>OUR LITTLE DAYS</p><h1>属于我们的日子。</h1><p>输入访问密钥，翻开相册。</p><form id="unlockForm"><label for="accessKey">访问密钥</label><input id="accessKey" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required><button id="unlock" type="submit">打开相册</button></form><p id="status" role="status" aria-live="polite"></p><button id="cancel" type="button" hidden>取消加载</button><progress id="progress" hidden value="0" max="1"></progress><p class="note">密钥仅用于本机解密，不会发送到服务器。刷新或关闭页面后需要重新输入。请妥善保存密钥，不要与网站链接一起公开分享。</p><p class="note">先加载轻量预览，高清照片在浏览时自动加载。当前为只读体验，修改和新增仍在电脑端完成。</p></main>
<div id="session" hidden><span>已解锁 · 只读相册</span><button id="lock">锁定相册</button></div><iframe id="viewer" title="我们的相册" hidden></iframe><script src="photo-requests.js?v=view4"></script><script src="unlock.js?v=view4"></script></body></html>
